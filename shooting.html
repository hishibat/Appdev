<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Space Blaster - iPad Shooting Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #gameContainer {
    position: relative;
    width: 100vmin;
    height: 100vmin;
    max-width: 100vw;
    max-height: 100vh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2a 100%);
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(0,255,255,0.5);
    pointer-events: none;
    z-index: 10;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
    z-index: 20;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    color: #0ff;
    font-size: 36px;
    margin-bottom: 20px;
    text-shadow: 0 0 20px #0ff;
  }
  #overlay p {
    color: #aef;
    font-size: 18px;
    margin-bottom: 30px;
    text-align: center;
    line-height: 1.6;
  }
  #overlay button {
    background: linear-gradient(180deg, #0af, #06c);
    border: none;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    padding: 15px 50px;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0,170,255,0.5);
    transition: transform 0.1s;
  }
  #overlay button:active {
    transform: scale(0.95);
  }
  .score-display {
    color: #ff0;
    text-shadow: 0 0 10px rgba(255,255,0,0.5);
  }
  .lives-display {
    color: #f55;
    text-shadow: 0 0 10px rgba(255,85,85,0.5);
  }
  #instructions {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="game"></canvas>
  <div id="ui">
    <span class="score-display">SCORE: <span id="score">0</span></span>
    <span>WAVE: <span id="wave">1</span></span>
    <span class="lives-display">LIVES: <span id="lives">3</span></span>
  </div>
  <div id="instructions">タッチでドラッグして移動 / 自動発射</div>
  <div id="overlay">
    <h1>SPACE BLASTER</h1>
    <p>画面をタッチして自機を操作<br>敵を撃破してスコアを稼げ!</p>
    <button id="startBtn">START GAME</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  // === Canvas Setup ===
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('gameContainer');

  let W, H;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const rect = container.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // === Game State ===
  let gameState = 'title'; // title, playing, gameover
  let score = 0;
  let lives = 3;
  let wave = 1;
  let waveTimer = 0;
  let gameTime = 0;

  // === UI Elements ===
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const waveEl = document.getElementById('wave');

  // === Player ===
  const player = {
    x: 0, y: 0,
    w: 40, h: 50,
    speed: 8,
    fireRate: 150, // ms
    lastFire: 0,
    invincible: 0,
    powerLevel: 1
  };

  // === Game Objects ===
  let bullets = [];
  let enemies = [];
  let enemyBullets = [];
  let particles = [];
  let powerups = [];
  let stars = [];

  // === Input ===
  let touchX = null;
  let touchY = null;
  let isTouching = false;

  // === Audio Context ===
  let audioCtx = null;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playSound(freq, duration, type = 'square', volume = 0.3) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  const SFX = {
    shoot: () => playSound(800, 0.05, 'square', 0.15),
    hit: () => playSound(200, 0.1, 'sawtooth', 0.2),
    explosion: () => playSound(100, 0.3, 'sawtooth', 0.3),
    powerup: () => playSound(600, 0.2, 'sine', 0.25),
    playerHit: () => playSound(80, 0.4, 'sawtooth', 0.4)
  };

  // === Star Background ===
  function initStars() {
    stars = [];
    for (let i = 0; i < 100; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: 0.5 + Math.random() * 2,
        size: 0.5 + Math.random() * 1.5,
        brightness: 0.3 + Math.random() * 0.7
      });
    }
  }

  function updateStars() {
    for (const star of stars) {
      star.y += star.speed;
      if (star.y > H) {
        star.y = 0;
        star.x = Math.random() * W;
      }
    }
  }

  function drawStars() {
    for (const star of stars) {
      ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
      ctx.fillRect(star.x, star.y, star.size, star.size);
    }
  }

  // === Player ===
  function resetPlayer() {
    player.x = W / 2;
    player.y = H - 100;
    player.invincible = 0;
    player.powerLevel = 1;
  }

  function updatePlayer(dt, now) {
    if (isTouching && touchX !== null && touchY !== null) {
      const dx = touchX - player.x;
      const dy = touchY - player.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 5) {
        const moveX = (dx / dist) * player.speed;
        const moveY = (dy / dist) * player.speed;
        player.x += moveX;
        player.y += moveY;
      }
    }

    // Keep in bounds
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
    player.y = Math.max(player.h / 2, Math.min(H - player.h / 2, player.y));

    // Auto fire
    if (now - player.lastFire > player.fireRate) {
      fireBullet();
      player.lastFire = now;
    }

    // Invincibility countdown
    if (player.invincible > 0) {
      player.invincible -= dt;
    }
  }

  function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);

    // Blink when invincible
    if (player.invincible > 0 && Math.floor(player.invincible * 10) % 2 === 0) {
      ctx.globalAlpha = 0.3;
    }

    // Engine glow
    ctx.fillStyle = '#f80';
    ctx.shadowColor = '#f80';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(-10, 20);
    ctx.lineTo(10, 20);
    ctx.lineTo(0, 35 + Math.random() * 10);
    ctx.closePath();
    ctx.fill();

    // Ship body
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#0af';
    ctx.beginPath();
    ctx.moveTo(0, -25);
    ctx.lineTo(-20, 20);
    ctx.lineTo(-5, 15);
    ctx.lineTo(0, 20);
    ctx.lineTo(5, 15);
    ctx.lineTo(20, 20);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#0ff';
    ctx.beginPath();
    ctx.ellipse(0, 0, 6, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wings glow
    if (player.powerLevel >= 2) {
      ctx.fillStyle = '#f0f';
      ctx.shadowColor = '#f0f';
      ctx.beginPath();
      ctx.arc(-18, 10, 4, 0, Math.PI * 2);
      ctx.arc(18, 10, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  // === Bullets ===
  function fireBullet() {
    SFX.shoot();
    const level = player.powerLevel;

    bullets.push({
      x: player.x,
      y: player.y - 30,
      vx: 0,
      vy: -12,
      w: 4,
      h: 15,
      damage: 1
    });

    if (level >= 2) {
      bullets.push({
        x: player.x - 15,
        y: player.y - 20,
        vx: -1,
        vy: -11,
        w: 3,
        h: 12,
        damage: 1
      });
      bullets.push({
        x: player.x + 15,
        y: player.y - 20,
        vx: 1,
        vy: -11,
        w: 3,
        h: 12,
        damage: 1
      });
    }

    if (level >= 3) {
      bullets.push({
        x: player.x - 25,
        y: player.y - 10,
        vx: -2,
        vy: -10,
        w: 3,
        h: 10,
        damage: 1
      });
      bullets.push({
        x: player.x + 25,
        y: player.y - 10,
        vx: 2,
        vy: -10,
        w: 3,
        h: 10,
        damage: 1
      });
    }
  }

  function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;
      if (b.y < -20 || b.x < -20 || b.x > W + 20) {
        bullets.splice(i, 1);
      }
    }
  }

  function drawBullets() {
    ctx.save();
    for (const b of bullets) {
      ctx.fillStyle = '#0ff';
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 10;
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    }
    ctx.restore();
  }

  // === Enemies ===
  const ENEMY_TYPES = {
    basic: { w: 30, h: 30, hp: 1, speed: 2, score: 100, color: '#f55' },
    fast: { w: 25, h: 25, hp: 1, speed: 4, score: 150, color: '#ff0' },
    tank: { w: 45, h: 45, hp: 3, speed: 1.5, score: 300, color: '#f80' },
    shooter: { w: 35, h: 35, hp: 2, speed: 1.5, score: 250, color: '#f0f', canShoot: true }
  };

  function spawnEnemy() {
    const types = Object.keys(ENEMY_TYPES);
    let type = 'basic';

    if (wave >= 2) type = types[Math.floor(Math.random() * 2)];
    if (wave >= 3) type = types[Math.floor(Math.random() * 3)];
    if (wave >= 4) type = types[Math.floor(Math.random() * 4)];

    const et = ENEMY_TYPES[type];
    enemies.push({
      x: Math.random() * (W - 100) + 50,
      y: -50,
      w: et.w,
      h: et.h,
      hp: et.hp + Math.floor(wave / 3),
      maxHp: et.hp + Math.floor(wave / 3),
      speed: et.speed + wave * 0.1,
      score: et.score,
      color: et.color,
      type: type,
      canShoot: et.canShoot || false,
      lastShot: 0,
      pattern: Math.floor(Math.random() * 3)
    });
  }

  function updateEnemies(now) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];

      // Movement patterns
      if (e.pattern === 0) {
        e.y += e.speed;
      } else if (e.pattern === 1) {
        e.y += e.speed;
        e.x += Math.sin(e.y * 0.02) * 2;
      } else {
        e.y += e.speed * 0.7;
        e.x += Math.cos(e.y * 0.03) * 3;
      }

      // Keep in bounds horizontally
      e.x = Math.max(e.w / 2, Math.min(W - e.w / 2, e.x));

      // Shooting enemies
      if (e.canShoot && now - e.lastShot > 1500) {
        enemyBullets.push({
          x: e.x,
          y: e.y + e.h / 2,
          vx: 0,
          vy: 5,
          w: 6,
          h: 10
        });
        e.lastShot = now;
      }

      // Remove if off screen
      if (e.y > H + 50) {
        enemies.splice(i, 1);
      }
    }
  }

  function drawEnemies() {
    ctx.save();
    for (const e of enemies) {
      ctx.fillStyle = e.color;
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 10;

      // Draw enemy ship
      ctx.beginPath();
      if (e.type === 'tank') {
        // Tank: hexagon
        ctx.moveTo(e.x, e.y - e.h / 2);
        ctx.lineTo(e.x + e.w / 2, e.y - e.h / 4);
        ctx.lineTo(e.x + e.w / 2, e.y + e.h / 4);
        ctx.lineTo(e.x, e.y + e.h / 2);
        ctx.lineTo(e.x - e.w / 2, e.y + e.h / 4);
        ctx.lineTo(e.x - e.w / 2, e.y - e.h / 4);
      } else {
        // Others: triangle pointing down
        ctx.moveTo(e.x, e.y + e.h / 2);
        ctx.lineTo(e.x - e.w / 2, e.y - e.h / 2);
        ctx.lineTo(e.x + e.w / 2, e.y - e.h / 2);
      }
      ctx.closePath();
      ctx.fill();

      // HP bar for tanks
      if (e.maxHp > 1) {
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#333';
        ctx.fillRect(e.x - 20, e.y - e.h / 2 - 10, 40, 4);
        ctx.fillStyle = '#0f0';
        ctx.fillRect(e.x - 20, e.y - e.h / 2 - 10, 40 * (e.hp / e.maxHp), 4);
      }
    }
    ctx.restore();
  }

  // === Enemy Bullets ===
  function updateEnemyBullets() {
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      b.x += b.vx;
      b.y += b.vy;
      if (b.y > H + 20) {
        enemyBullets.splice(i, 1);
      }
    }
  }

  function drawEnemyBullets() {
    ctx.save();
    ctx.fillStyle = '#f0f';
    ctx.shadowColor = '#f0f';
    ctx.shadowBlur = 8;
    for (const b of enemyBullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.w / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // === Power-ups ===
  const POWERUP_TYPES = ['power', 'life', 'speed'];

  function spawnPowerup(x, y) {
    if (Math.random() > 0.15) return; // 15% chance
    powerups.push({
      x: x,
      y: y,
      type: POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)],
      vy: 2
    });
  }

  function updatePowerups() {
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.y += p.vy;
      if (p.y > H + 20) {
        powerups.splice(i, 1);
      }
    }
  }

  function drawPowerups() {
    ctx.save();
    for (const p of powerups) {
      let color = '#0f0';
      let symbol = 'P';
      if (p.type === 'life') { color = '#f55'; symbol = '+'; }
      if (p.type === 'speed') { color = '#ff0'; symbol = 'S'; }

      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(symbol, p.x, p.y);
    }
    ctx.restore();
  }

  // === Particles ===
  function createExplosion(x, y, color, count = 20) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
      const speed = 2 + Math.random() * 4;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.02 + Math.random() * 0.02,
        size: 2 + Math.random() * 4,
        color: color
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) {
        particles.splice(i, 1);
      }
    }
  }

  function drawParticles() {
    ctx.save();
    for (const p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 5;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.restore();
  }

  // === Collision Detection ===
  function checkCollisions() {
    // Bullets vs Enemies
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
      const b = bullets[bi];
      for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        if (rectCollide(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h,
                        e.x - e.w / 2, e.y - e.h / 2, e.w, e.h)) {
          bullets.splice(bi, 1);
          e.hp -= b.damage;
          SFX.hit();
          createExplosion(b.x, b.y, '#fff', 5);

          if (e.hp <= 0) {
            score += e.score;
            createExplosion(e.x, e.y, e.color, 25);
            SFX.explosion();
            spawnPowerup(e.x, e.y);
            enemies.splice(ei, 1);
          }
          break;
        }
      }
    }

    // Player vs Enemies
    if (player.invincible <= 0) {
      for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        if (rectCollide(player.x - player.w / 2, player.y - player.h / 2, player.w, player.h,
                        e.x - e.w / 2, e.y - e.h / 2, e.w, e.h)) {
          playerHit();
          createExplosion(e.x, e.y, e.color, 20);
          enemies.splice(ei, 1);
          break;
        }
      }
    }

    // Player vs Enemy Bullets
    if (player.invincible <= 0) {
      for (let bi = enemyBullets.length - 1; bi >= 0; bi--) {
        const b = enemyBullets[bi];
        if (rectCollide(player.x - player.w / 2, player.y - player.h / 2, player.w, player.h,
                        b.x - b.w / 2, b.y - b.h / 2, b.w, b.h)) {
          playerHit();
          enemyBullets.splice(bi, 1);
          break;
        }
      }
    }

    // Player vs Powerups
    for (let pi = powerups.length - 1; pi >= 0; pi--) {
      const p = powerups[pi];
      const dist = Math.hypot(player.x - p.x, player.y - p.y);
      if (dist < 30) {
        SFX.powerup();
        if (p.type === 'power') {
          player.powerLevel = Math.min(3, player.powerLevel + 1);
        } else if (p.type === 'life') {
          lives = Math.min(5, lives + 1);
        } else if (p.type === 'speed') {
          player.fireRate = Math.max(80, player.fireRate - 20);
        }
        createExplosion(p.x, p.y, '#0f0', 10);
        powerups.splice(pi, 1);
      }
    }
  }

  function rectCollide(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
  }

  function playerHit() {
    lives--;
    SFX.playerHit();
    createExplosion(player.x, player.y, '#0af', 30);
    player.invincible = 2;
    player.powerLevel = Math.max(1, player.powerLevel - 1);

    if (lives <= 0) {
      gameOver();
    }
  }

  // === Wave Management ===
  function updateWave(dt, now) {
    waveTimer += dt;

    // Spawn rate increases with wave
    const spawnInterval = Math.max(0.3, 1.5 - wave * 0.1);

    if (waveTimer > spawnInterval) {
      spawnEnemy();
      waveTimer = 0;
    }

    // Wave progression based on score
    const newWave = Math.floor(score / 2000) + 1;
    if (newWave > wave) {
      wave = newWave;
      // Flash effect could go here
    }
  }

  // === Game Flow ===
  function startGame() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    gameState = 'playing';
    score = 0;
    lives = 3;
    wave = 1;
    waveTimer = 0;
    gameTime = 0;

    bullets = [];
    enemies = [];
    enemyBullets = [];
    particles = [];
    powerups = [];

    resetPlayer();
    initStars();
    overlay.classList.add('hidden');
  }

  function gameOver() {
    gameState = 'gameover';
    overlay.querySelector('h1').textContent = 'GAME OVER';
    overlay.querySelector('p').innerHTML = `最終スコア: ${score}<br>到達WAVE: ${wave}`;
    startBtn.textContent = 'RETRY';
    overlay.classList.remove('hidden');
  }

  // === Main Loop ===
  let lastTime = 0;

  function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    // Clear
    ctx.clearRect(0, 0, W, H);

    // Background
    updateStars();
    drawStars();

    if (gameState === 'playing') {
      gameTime += dt;

      updatePlayer(dt, timestamp);
      updateBullets();
      updateEnemies(timestamp);
      updateEnemyBullets();
      updatePowerups();
      updateParticles();
      updateWave(dt, timestamp);
      checkCollisions();

      drawPlayer();
      drawBullets();
      drawEnemies();
      drawEnemyBullets();
      drawPowerups();
      drawParticles();

      // Update UI
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      waveEl.textContent = wave;
    }

    requestAnimationFrame(gameLoop);
  }

  // === Touch Events ===
  function handleTouchStart(e) {
    e.preventDefault();
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    touchX = (touch.clientX - rect.left) * (W / rect.width);
    touchY = (touch.clientY - rect.top) * (H / rect.height);
    isTouching = true;
  }

  function handleTouchMove(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    touchX = (touch.clientX - rect.left) * (W / rect.width);
    touchY = (touch.clientY - rect.top) * (H / rect.height);
  }

  function handleTouchEnd(e) {
    e.preventDefault();
    isTouching = false;
  }

  canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
  canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
  canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

  // Mouse support for testing
  canvas.addEventListener('mousedown', (e) => {
    initAudio();
    const rect = canvas.getBoundingClientRect();
    touchX = (e.clientX - rect.left) * (W / rect.width);
    touchY = (e.clientY - rect.top) * (H / rect.height);
    isTouching = true;
  });

  canvas.addEventListener('mousemove', (e) => {
    if (isTouching) {
      const rect = canvas.getBoundingClientRect();
      touchX = (e.clientX - rect.left) * (W / rect.width);
      touchY = (e.clientY - rect.top) * (H / rect.height);
    }
  });

  canvas.addEventListener('mouseup', () => {
    isTouching = false;
  });

  canvas.addEventListener('mouseleave', () => {
    isTouching = false;
  });

  // === Start Button ===
  startBtn.addEventListener('click', startGame);
  startBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    startGame();
  });

  // === Initialize ===
  initStars();
  requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
